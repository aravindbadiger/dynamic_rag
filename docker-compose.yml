services:
  # ── File System Producer ──────────────────────────────────────────
  file-system-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-system-producer
    env_file:
      - .env.docker
    environment:
      INGESTION_STATUS_TOPIC: ${INGESTION_STATUS_TOPIC:-ingestion-status-topic}
    command: python file_system_producer.py
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./content:/app/content
      - ./data:/app/data

  # ── MongoDB Producer ──────────────────────────────────────────────
  mongo-db-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mongo-db-producer
    env_file:
      - .env.docker
    environment:
      INGESTION_STATUS_TOPIC: ${INGESTION_STATUS_TOPIC:-ingestion-status-topic}
    command: python mongo_db_producer.py
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── File System Consumer ──────────────────────────────────────────
  file-system-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-system-consumer
    env_file:
      - .env.docker
    environment:
      KAFKA_CONSUMER_GROUP: ${FILE_SYSTEM_CONSUMER_GROUP:-file-system-consumer-group}
    command: python file_system_consumer.py
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── MongoDB Consumer ──────────────────────────────────────────────
  mongo-db-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mongo-db-consumer
    env_file:
      - .env.docker
    environment:
      KAFKA_CONSUMER_GROUP: ${MONGO_DB_CONSUMER_GROUP:-mongo-db-consumer-group}
    command: python mongo_db_consumer.py
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── Qdrant vector database ──────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    env_file:
      - .env.docker
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama LLM server ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    env_file:
      - .env.docker
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── RAG Application ─────────────────────────────────────────────────
  rag-app:
    command: python rag_client.py
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    env_file:
      - .env.docker
    environment:
      SEARCH_PRODUCER_URL: http://search-producer-service:8081/search
    ports:
      - "${GRADIO_SERVER_PORT:-7861}:7861"
    volumes:
      # Mount content/ so you can drop files from the host
      - ./content:/app/content
      # Persist processed data
      - rag_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7861/')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── Kafka & Zookeeper ───────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_datalog:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_CREATE_TOPICS: "vector-search-request:1:1,vector-search-response:1:1"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ── Status Service ───────────────────────────────────────────────
  status-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: status-service
    env_file:
      - .env.docker
    environment:
      INGESTION_STATUS_TOPIC: ${INGESTION_STATUS_TOPIC:-ingestion-status-topic}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      STATUS_FILE: /app/data/ingestion_status.json
    command: python status_service.py
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

    # ── Qdrant Stats Producer ──────────────────────────────────────────────
  qdrant-stats-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qdrant-stats-producer
    env_file:
      - .env.docker
    environment:
      QDRANT_STATS_TOPIC: ${QDRANT_STATS_TOPIC:-qdrant-stats-topic}
      QDRANT_STATS_POLL_INTERVAL: ${QDRANT_STATS_POLL_INTERVAL:-30}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    command: python qdrant_stats_producer.py
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

     # ── Search Producer Service (REST API for search) ───────────────
  search-producer-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: search-producer-service
    env_file:
      - .env.docker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    command: python search_producer_service.py
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── Qdrant Search Consumer (Kafka search worker) ────────────────
  qdrant-search-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qdrant-search-consumer
    env_file:
      - .env.docker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    command: python qdrant_search_consumer.py
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
  ollama_data:
    driver: local
  rag_data:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_datalog:
    driver: local
