# =============================================================================
# Dynamic Embedding RAG — Docker Compose
# =============================================================================
#
# Services:
#   qdrant   — Qdrant vector database (official image)
#   ollama   — Ollama LLM server (local model inference)
#   rag-app  — The RAG application (Gradio UI + ingestion pipeline)
#
# Usage:
#   docker compose up -d              # start everything
#   docker compose up -d --build      # rebuild app image and start
#   docker compose exec rag-app python ingest_data.py scan   # one-shot ingest
#   docker compose exec rag-app python ingest_data.py watch  # continuous watcher
#   docker compose logs -f rag-app    # follow app logs
#   docker compose down               # stop and remove containers
#   docker compose down -v            # …and remove volumes
#
# Pull a model into Ollama:
#   docker compose exec ollama ollama pull llama3.2
#
# The Gradio UI is at http://localhost:7861
# The Qdrant dashboard is at http://localhost:6333/dashboard
# The Ollama API is at http://localhost:11434
# =============================================================================

services:
  # ── Qdrant vector database ──────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    env_file:
      - .env.docker
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama LLM server ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    env_file:
      - .env.docker
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── RAG Application ─────────────────────────────────────────────────
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    env_file:
      - .env.docker
    ports:
      - "${GRADIO_SERVER_PORT:-7861}:7861"
    volumes:
      # Mount content/ so you can drop files from the host
      - ./content:/app/content
      # Persist processed data
      - rag_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7861/')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
  ollama_data:
    driver: local
  rag_data:
    driver: local
